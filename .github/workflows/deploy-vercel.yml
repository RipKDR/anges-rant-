name: Deploy to Vercel

on:
  push:
    branches: ["claude/band-webpage-redesign-6kjwtg"]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: harrisonferraro99-4774
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it: repo Settings → Secrets and variables → Actions → New repository secret (name: VERCEL_TOKEN)."
            exit 1
          fi
          npx vercel@latest link --yes --project anges-rant --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          URL=$(npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $URL"
          {
            echo "### Deployed to Vercel 🚀"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
